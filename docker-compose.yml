services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bloret
      POSTGRES_PASSWORD: bloret
      POSTGRES_DB: translation_collector
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bloret -d translation_collector"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
